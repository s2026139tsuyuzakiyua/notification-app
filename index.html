<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>通知アプリ</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1>○○ショップ</h1>
    <p>お店からのお知らせ</p>
  </header>

  <main>

    <!-- ユーザー側 -->
    <section>
      <h2>お知らせ</h2>

      <div id="noticeList">

        <div class="notice">
          <p class="date">2026年9月3日</p>
          <h3>新商品のお知らせ</h3>
          <p>9月10日から新商品を販売します！</p>
        </div>

      </div>
    </section>


    <!-- お店側 -->
    <section class="admin">

      <h2>お店側・管理画面</h2>

      <label for="title">タイトル</label>

      <input
        type="text"
        id="title"
        placeholder="例：新商品のお知らせ"
      >


      <label for="content">内容</label>

      <textarea
        id="content"
        placeholder="例：明日から新商品を販売します！"
      ></textarea>


      <button id="sendButton">
        お知らせを送信
      </button>

      <p id="message"></p>

    </section>

  </main>


  <footer>
    <p>© 2026 ○○ショップ</p>
  </footer>


  <script src="script.js"></script>

</body>

</html>
